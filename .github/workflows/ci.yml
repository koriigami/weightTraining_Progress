# Runs on every push and pull request: type check, the full unit suite, the
# em dash check, then a production build. Same as `npm run verify:full` locally.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check, unit tests, em dash check
        run: npm run verify
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
